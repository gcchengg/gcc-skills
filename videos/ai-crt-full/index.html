<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />

    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "HF Song"; src: local("Songti SC"); }
      @font-face { font-family: "HF Kai"; src: local("Kaiti SC"); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050505; }
      body { font-family: "HF Song", serif; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .surround { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, #1a1516 0%, #080707 55%, #020202 100%); }
      .shell { position: absolute; left: 150px; top: 86px; width: 1620px; height: 908px; padding: 30px; border-radius: 86px; background: linear-gradient(145deg,#282324,#090808 44%,#181314); border: 2px solid rgba(243,239,230,.14); box-shadow: 0 34px 100px rgba(0,0,0,.92), inset 0 1px 0 rgba(255,255,255,.09), 0 0 72px rgba(176,53,60,.13); }
      .glass { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 58px; background: #101010; box-shadow: inset 0 0 100px rgba(0,0,0,.95); isolation: isolate; }
      .backgrounds { position: absolute; inset: 0; overflow: hidden; }
      .background { position: absolute; inset: -3%; width: 106%; height: 106%; object-fit: cover; opacity: 0; transform-origin: 50% 50%; }
      .background-shade { position: absolute; inset: 0; z-index: 1; background: rgba(5,3,4,.76); box-shadow: inset 0 0 150px 50px rgba(0,0,0,.68); }
      .camera { position: absolute; inset: 0; overflow: hidden; }
      .phrase { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; opacity: 0; }
      .phrase::before { content: ""; position: absolute; inset: -10%; background: radial-gradient(ellipse at center, rgba(176,53,60,.17), transparent 62%); }
      .brush { position: absolute; left: 50%; top: 50%; width: 110%; text-align: center; color: #b1373e; font: 900 430px/.82 "HF Kai", serif; letter-spacing: -.1em; white-space: nowrap; opacity: .88; filter: blur(.3px) drop-shadow(0 0 24px rgba(229,34,45,.3)); mix-blend-mode: screen; }
      .headline { position: relative; z-index: 3; width: 1370px; padding: 0 40px; color: #f3efe6; text-align: center; font-size: 126px; line-height: 1.08; font-weight: 900; letter-spacing: .05em; text-shadow: 3px 0 rgba(229,34,45,.42), -2px 0 rgba(80,160,180,.22), 0 8px 26px #000; }
      .headline.long { font-size: 104px; }
      .headline.short { font-size: 152px; }
      .scanlines,.grain,.vignette,.glint { position:absolute; inset:0; pointer-events:none; }
      .scanlines { z-index:8; opacity:.13; background:repeating-linear-gradient(to bottom,rgba(255,255,255,.13) 0,rgba(255,255,255,.13) 1px,rgba(0,0,0,.24) 2px,rgba(0,0,0,.24) 4px); mix-blend-mode:overlay; }
      .grain { z-index:9; opacity:.18; background-image:repeating-radial-gradient(circle at 17% 23%,rgba(255,255,255,.15) 0 1px,transparent 1px 4px),repeating-radial-gradient(circle at 73% 61%,rgba(255,255,255,.1) 0 1px,transparent 1px 5px); background-size:13px 17px,19px 11px; mix-blend-mode:soft-light; }
      .vignette { z-index:10; box-shadow:inset 0 0 170px 90px rgba(0,0,0,.72); border-radius:58px; }
      .glint { z-index:11; background:linear-gradient(118deg,rgba(255,255,255,.055),transparent 27%,transparent 74%,rgba(255,255,255,.018)); }
      .label { position:absolute; z-index:12; left:62px; top:46px; color:rgba(243,239,230,.56); font:600 19px/1 Menlo,monospace; letter-spacing:.16em; }
      .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#e5222d; margin-right:10px; box-shadow:0 0 10px #e5222d; }
      .endmark { position:absolute; z-index:12; right:62px; bottom:42px; color:rgba(243,239,230,.52); font:700 18px/1 Menlo,monospace; letter-spacing:.12em; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="49.733" data-fps="30" data-width="1920" data-height="1080">
      <div id="visual" class="clip" data-start="0" data-duration="49.733" data-track-index="1">
        <div class="surround"></div>
        <div class="shell"><div class="glass" id="glass">
          <div class="backgrounds" id="backgrounds" data-layout-allow-overflow="true">
            <img class="background" id="background-0" src="assets/backgrounds/bg-01.jpg" alt="" />
            <img class="background" id="background-1" src="assets/backgrounds/bg-02.jpg" alt="" />
            <img class="background" id="background-2" src="assets/backgrounds/bg-03.jpg" alt="" />
            <img class="background" id="background-3" src="assets/backgrounds/bg-04.jpg" alt="" />
            <img class="background" id="background-4" src="assets/backgrounds/bg-05.jpg" alt="" />
            <img class="background" id="background-5" src="assets/backgrounds/bg-06.jpg" alt="" />
            <div class="background-shade"></div>
          </div>
          <div class="camera" id="camera" data-layout-allow-overflow="true" style="z-index:2"></div>

          <div class="scanlines"></div><div class="grain" id="grain"></div><div class="vignette"></div><div class="glint"></div>
        </div></div>
      </div>
      <audio id="original-audio" class="clip" src="assets/xhs-audio.wav" data-start="0" data-duration="49.733" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const items = [
        [0,0.5,"请小红书","小红书"],[0.5,1.5,"平台优先","优先"],[1.5,2.5,"以下内容","内容"],[2.5,3,"时事新闻","新闻"],[3,4,"人文地理","地理"],[4,4.5,"宏观经济","经济"],[4.5,5.5,"发展走势","走势"],[5.5,6.5,"前沿科技与","科技"],[6.5,7.5,"AI发展趋势","AI"],[7.5,8,"实用理财","理财"],[8,9,"干货基础","干货"],[9,9.5,"法律常识","法律"],[9.5,10,"国学文化","国学"],[10,11,"为人处事","处事"],[11,11.5,"与情商","情商"],[11.5,12,"提升类正","提升"],[12,13,"能量资讯","能量"],[13,14,"我计划长期","长期"],[14,14.5,"深耕这些领域","深耕"],[14.5,15.5,"借助新闻把握","新闻"],[15.5,16.5,"全球时代局势","局势"],[16.5,17,"依托地理","地理"],[17,17.5,"与国学","国学"],[17.5,19,"拓宽眼界底蕴","眼界"],[19,19.5,"通过实证","实证"],[19.5,20,"经济看","经济"],[20,20.5,"懂市场与","市场"],[20.5,21.5,"政策风向","政策"],[21.5,22.5,"研究理财夯实","理财"],[22.5,24,"资产管理能力","资产"],[24,25,"了解AI科技","AI科技"],[25,25.5,"紧跟产业","产业"],[25.5,26.5,"变革节奏","变革"],[26.5,27,"学习法律","法律"],[27,28,"守护自身权益","权益"],[28,29,"修炼情商","情商"],[29,29.5,"妥善处理","处理"],[29.5,30.5,"各类人际关系","关系"],[30.5,31,"全方位","全面"],[31,32,"吸收知识","知识"],[32,32.5,"稳步拔高个人","拔高"],[32.5,33.5,"认知与","认知"],[33.5,34.5,"判断能力","判断"],[34.5,35.5,"同时请减少","减少"],[35.5,36.5,"心灵鸡汤","鸡汤"],[36.5,37,"带货直播","带货"],[37,37.5,"美食探店","探店"],[37.5,38,"游戏娱乐","游戏"],[38,39,"等内容","内容"],[39,39.5,"这类内容","这类"],[39.5,40.5,"容易分散精力","分散"],[40.5,41,"诱导消费","消费"],[41,41.5,"无益于","无益"],[41.5,42.5,"自我提升","提升"],[42.5,43.5,"愿静下心来","静心"],[43.5,44,"持续精进","精进"],[44,45,"在复杂环境中","复杂"],[45,45.5,"保持清醒","清醒"],[45.5,49.733,"与通透","通透"]
      ];
      const camera = document.getElementById("camera");
      items.forEach((it, i) => {
        const section = document.createElement("section");
        section.className = "phrase";
        section.id = `phrase-${i}`;
        section.setAttribute("data-layout-allow-overflow", "true");
        const sizeClass = it[2].length <= 4 ? "short" : (it[2].length >= 7 ? "long" : "");
        section.innerHTML = `<div class="brush" id="brush-${i}" data-layout-allow-overlap="true" data-layout-allow-overflow="true" aria-hidden="true">${it[3]}</div><div class="headline ${sizeClass}" id="headline-${i}">${it[2]}</div>`;
        camera.appendChild(section);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#glass", { opacity: 0 }, { opacity: 1, duration: .16, ease: "power4.out" }, 0);
      const bgStarts = [0, 8, 16, 24, 32, 40];
      bgStarts.forEach((start, i) => {
        const selector = `#background-${i}`;
        tl.fromTo(selector, { opacity: 0, scale: 1.02, x: i % 2 ? 22 : -22 }, { opacity: .42, scale: 1.09, x: 0, duration: 1.0, ease: "power2.out" }, start);
        tl.to(selector, { scale: 1.15, duration: Math.min(9, 49.733 - start), ease: "none" }, start + 1.0);
        if (i < bgStarts.length - 1) tl.to(selector, { opacity: 0, duration: .8, ease: "power2.in" }, bgStarts[i + 1] - .8);
      });
      items.forEach((it, i) => {
        const start = it[0], end = it[1], dur = end - start;
        const scene = `#phrase-${i}`, brush = `#brush-${i}`, headline = `#headline-${i}`;
        tl.set(scene, { opacity: 1 }, start);
        tl.fromTo(brush, { xPercent: -50, yPercent: -50, scale: .72 + (i % 3) * .08, rotation: i % 2 ? 3 : -3, opacity: .25 }, { xPercent: -50, yPercent: -50, scale: 1.06, rotation: 0, opacity: .88, duration: Math.min(.28, dur * .34), ease: "expo.out" }, start + .02);
        tl.fromTo(headline, { scale: .74, y: i % 2 ? -54 : 54, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: Math.min(.26, dur * .32), ease: "power4.out" }, start + .05);
        if (dur >= .72) {
          const shakeAt = start + Math.min(.31, dur * .38);
          tl.to(headline, { x: 15, duration: .035, ease: "power4.out" }, shakeAt)
            .to(headline, { x: -10, duration: .035 }, shakeAt + .04)
            .to(headline, { x: 6, duration: .035 }, shakeAt + .08)
            .to(headline, { x: 0, duration: .04 }, shakeAt + .12);
        }
        const exitAt = Math.max(start + .22, end - .1);
        tl.to(headline, { scale: 1.12, opacity: 0, duration: .09, ease: "expo.in" }, exitAt);
        if (i < items.length - 1) tl.set(scene, { opacity: 0 }, end);
      });
      tl.to("#grain", { x: 3, y: -2, duration: .08, repeat: 150, yoyo: true, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
