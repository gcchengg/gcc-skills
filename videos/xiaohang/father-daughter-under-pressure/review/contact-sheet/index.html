<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #17130f; }
    .composition {
      width: 1800px;
      height: 1440px;
      padding: 54px;
      background: #17130f;
      color: #f4ead9;
      font-family: "PingFang SC", sans-serif;
    }
    h1 { margin: 0 0 28px; font-size: 42px; letter-spacing: 2px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; }
    .card { overflow: hidden; border: 2px solid #5f503e; border-radius: 14px; background: #292119; }
    img { display: block; width: 100%; height: 1110px; object-fit: cover; }
    .label { height: 82px; display: grid; place-items: center; font-size: 30px; font-weight: 700; }
    .note { margin-top: 28px; color: #bfae95; font-size: 24px; }
  </style>
</head>
<body>
  <div class="composition" data-composition-id="xiaohang-scenes-02-06-contact-sheet" data-start="0" data-duration="1" data-width="1800" data-height="1440">
    <h1>《爸爸没来家长会》Scene 02–06 字幕预览</h1>
    <div class="grid">
      <div class="card"><img src="assets/scene-02-preview-v1.png" alt=""><div class="label">Scene 02</div></div>
      <div class="card"><img src="assets/scene-03-preview-v1.png" alt=""><div class="label">Scene 03</div></div>
      <div class="card"><img src="assets/scene-04-preview-v1.png" alt=""><div class="label">Scene 04</div></div>
      <div class="card"><img src="assets/scene-05-preview-v1.png" alt=""><div class="label">Scene 05</div></div>
      <div class="card"><img src="assets/scene-06-preview-v1.png" alt=""><div class="label">Scene 06</div></div>
    </div>
    <div class="note">审核重点：人物连续性、动作叙事、字幕可读性与无字源图。</div>
  </div>
</body>
</html>
