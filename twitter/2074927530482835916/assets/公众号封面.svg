    <text x="348" y="53" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#ffffff">证据</text>
    <rect x="616" width="270" height="84" rx="18" fill="#8b5e21"/>
    <text x="656" y="53" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#ffffff">判定</text>
    <rect x="924" width="270" height="84" rx="18" fill="#2f5b36"/>
    <text x="964" y="53" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#ffffff">责任</text>
  </g>
  <text x="104" y="505" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" fill="#555555">从 Own the Outer Loop 看智能体工程的真正工作边界</text>
</svg>
