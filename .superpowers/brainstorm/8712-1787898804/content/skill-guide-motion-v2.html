<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Skill 装机指南 - 动效首屏</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow-x:hidden}.stage{min-height:100vh;position:relative;display:grid;place-items:center;overflow:hidden}.noise{position:absolute;inset:0;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none}.aurora{position:absolute;width:760px;height:760px;border-radius:50%;background:conic-gradient(from 20deg,#ff3155,#743cff,#18d5c6,#ffd34d,#ff3155);filter:blur(95px);opacity:.18;animation:breathe 5s ease-in-out infinite}.grid{position:absolute;inset:-30%;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:42px 42px;transform:perspective(600px) rotateX(64deg) translateY(35%);mask-image:linear-gradient(to top,#000 20%,transparent 72%);animation:gridmove 8s linear infinite}.shell{width:min(92vw,430px);min-height:760px;position:relative;padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:center;opacity:0;animation:fadeDown .7s .2s forwards}.brand{display:flex;gap:9px;align-items:center;font-weight:750;font-size:13px;letter-spacing:.4px}.brand i{width:28px;height:28px;border-radius:9px;background:#ff3155;display:grid;place-items:center;font-style:normal;box-shadow:0 0 30px rgba(255,49,85,.55)}.beta{border:1px solid rgba(255,255,255,.14);padding:6px 9px;border-radius:99px;color:#aeb1bc;font-size:10px}.core{position:relative;height:330px;display:grid;place-items:center}.ring,.ring2,.ring3{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.2);opacity:0}.ring{width:210px;height:210px;animation:ringIn .9s .55s forwards,spin 12s 1.5s linear infinite}.ring2{width:270px;height:270px;border-style:dashed;animation:ringIn .9s .75s forwards,spinBack 17s 1.5s linear infinite}.ring3{width:320px;height:320px;border-color:rgba(255,49,85,.22);animation:ringIn .9s .95s forwards,pulse 3s 2s ease-in-out infinite}.ring:before,.ring:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#ff3155;box-shadow:0 0 20px #ff3155}.ring:before{top:-5px;left:48%}.ring:after{bottom:-5px;left:48%;background:#26e0cb;box-shadow:0 0 20px #26e0cb}.skill{position:absolute;padding:9px 12px;border:1px solid rgba(255,255,255,.15);background:rgba(20,22,32,.72);backdrop-filter:blur(12px);border-radius:12px;font-size:11px;font-weight:650;color:#ddd;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.3)}.s1{transform:translate(-180px,-105px) rotate(-14deg);animation:tileIn .65s 1.1s forwards}.s2{transform:translate(175px,-85px) rotate(12deg);animation:tileIn .65s 1.23s forwards}.s3{transform:translate(-190px,92px) rotate(9deg);animation:tileIn .65s 1.36s forwards}.s4{transform:translate(182px,105px) rotate(-10deg);animation:tileIn .65s 1.49s forwards}.s5{transform:translate(0,-168px) rotate(3deg);animation:tileIn .65s 1.62s forwards}.coremark{width:132px;height:132px;border-radius:38px;position:relative;background:linear-gradient(145deg,#ff3155,#ff6b75 52%,#ffca55);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.22),0 25px 80px rgba(255,49,85,.44);transform:scale(.12) rotate(-55deg);opacity:0;animation:coreIn .9s 1.2s cubic-bezier(.2,1.45,.3,1) forwards}.coremark span{font-size:38px;font-weight:950;letter-spacing:-3px}.scan{position:absolute;width:170px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);filter:drop-shadow(0 0 8px #fff);opacity:0;animation:scan 1.25s 1.85s ease-in-out forwards}.copy{text-align:center;position:relative}.eyebrow{font-size:11px;letter-spacing:3px;color:#ff6c82;font-weight:800;opacity:0;animation:fadeUp .55s 2.1s forwards}.copy h1{font-size:38px;line-height:1.12;letter-spacing:-1.5px;margin:11px 0 12px;opacity:0;filter:blur(12px);transform:translateY(18px);animation:titleIn .8s 2.25s forwards}.copy p{font-size:14px;color:#aeb1bc;line-height:1.65;margin:0 auto;max-width:340px;opacity:0;animation:fadeUp .6s 2.6s forwards}.actions{opacity:0;transform:translateY(16px);animation:fadeUp .6s 2.9s forwards}.cta{width:100%;border:0;border-radius:18px;padding:17px;color:#111;background:#fff;font-size:16px;font-weight:800;position:relative;overflow:hidden;box-shadow:0 12px 50px rgba(255,255,255,.12)}.cta:before{content:"";position:absolute;inset:-2px;transform:translateX(-120%) skewX(-20deg);width:45%;background:linear-gradient(90deg,transparent,rgba(255,49,85,.25),transparent);animation:shine 3s 3.4s infinite}.meta{display:flex;justify-content:center;gap:12px;font-size:10px;color:#727680;margin-top:12px}.replay{position:fixed;right:18px;bottom:18px;border:1px solid rgba(255,255,255,.17);background:rgba(15,16,24,.75);color:#fff;border-radius:99px;padding:10px 13px;cursor:pointer;backdrop-filter:blur(10px)}
@keyframes breathe{50%{transform:scale(1.15) rotate(45deg);opacity:.28}}@keyframes gridmove{to{background-position:0 84px}}@keyframes fadeDown{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(-12px)}}@keyframes ringIn{to{opacity:1;transform:scale(1)}from{opacity:0;transform:scale(.45)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}@keyframes pulse{50%{transform:scale(1.04);opacity:.35}}@keyframes tileIn{to{opacity:1;transform:translate(0,0) rotate(0)}}@keyframes coreIn{to{opacity:1;transform:scale(1) rotate(0)}}@keyframes scan{0%{opacity:0;transform:translateY(-70px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(70px)}}@keyframes titleIn{to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes fadeUp{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(13px)}}@keyframes shine{20%,100%{transform:translateX(300%) skewX(-20deg)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="stage">
  <div class="aurora"></div><div class="grid"></div><div class="noise"></div>
  <section class="shell">
    <header class="top"><div class="brand"><i>S</i>AI Skill 装机指南</div><span class="beta">LOCAL · 1 MIN</span></header>
    <div>
      <div class="core">
        <div class="ring"></div><div class="ring2"></div><div class="ring3"></div>
        <span class="skill s1">代码审查</span><span class="skill s2">UI 设计</span><span class="skill s3">行业研究</span><span class="skill s4">内容创作</span><span class="skill s5">数据分析</span>
        <div class="coremark"><span>SK</span></div><div class="scan"></div>
      </div>
      <div class="copy"><div class="eyebrow">BUILD YOUR AI STACK</div><h1>干这行，应该<br>安装哪些 Skill？</h1><p>选择行业与岗位，回答 3 个问题，生成真正适合你的 AI Skill 装机单。</p></div>
    </div>
    <div class="actions"><button class="cta">开始扫描我的职业 →</button><div class="meta"><span>无需登录</span><span>·</span><span>本地运行</span><span>·</span><span>结果可分享</span></div></div>
  </section>
</main>
<button class="replay" onclick="location.reload()">↻ 重播入场</button>
</body></html>
