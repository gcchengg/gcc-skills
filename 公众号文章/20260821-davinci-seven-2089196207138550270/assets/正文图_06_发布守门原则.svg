<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" rx="36" fill="#0b1522"/><text x="70" y="90" font-family="PingFang SC,sans-serif" font-size="42" font-weight="700" fill="#fff">可信自动化：不确定时要停，不要猜</text><g font-family="PingFang SC,sans-serif"><rect x="70" y="155" width="1060" height="420" rx="28" fill="#10291f" stroke="#4ade80"/><g fill="#4ade80" font-size="30" font-weight="700"><text x="115" y="225">01</text><text x="115" y="305">02</text><text x="115" y="385">03</text><text x="115" y="465">04</text></g><g fill="#fff" font-size="29"><text x="190" y="225">原稿哈希变化 → 立即停止</text><text x="190" y="305">本地图片缺失 → 立即停止</text><text x="190" y="385">遇到不支持的 Markdown → 指明行号后停止</text><text x="190" y="465">生成与检查完成 → 仍由人确认是否公开发布</text></g><g fill="#86efac" font-size="23"><text x="790" y="225">SHA256</text><text x="790" y="305">图片证据表</text><text x="790" y="385">显式降级记录</text><text x="790" y="465">Human gate</text></g></g><text x="70" y="665" font-size="28" fill="#86efac">功能清单说明“能做什么”，停止规则决定“是否值得信任”。</text></g></svg>
