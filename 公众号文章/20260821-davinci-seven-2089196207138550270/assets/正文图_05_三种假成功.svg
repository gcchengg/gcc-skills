<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" rx="36" fill="#170f14"/><text x="70" y="90" font-family="PingFang SC,sans-serif" font-size="42" font-weight="700" fill="#fff">三种“绿灯全亮”的假成功</text><g font-family="PingFang SC,sans-serif"><g fill="#291a22" stroke="#fb7185"><rect x="70" y="155" width="320" height="410" rx="24"/><rect x="440" y="155" width="320" height="410" rx="24"/><rect x="810" y="155" width="320" height="410" rx="24"/></g><g fill="#fb7185" font-size="34" font-weight="700"><text x="105" y="220">文件存在</text><text x="475" y="220">0 ERROR</text><text x="845" y="220">文本顺序通过</text></g><g fill="#fecdd3" font-size="24"><text x="105" y="280">≠ 截图真的生成</text><text x="105" y="340">脚本只检查文件，</text><text x="105" y="382">没有执行截图。</text><text x="475" y="280">≠ 仓库真的干净</text><text x="475" y="340">UTF-16 日志被按</text><text x="475" y="382">UTF-8 读成乱码。</text><text x="845" y="280">≠ 格式真的完整</text><text x="845" y="340">图片和语法丢失，</text><text x="845" y="382">纯文本仍然一致。</text></g><text x="70" y="650" font-size="29" fill="#fda4af">共同病根：把“方便检查的代理指标”，误当成“真实成功”。</text></g></svg>
