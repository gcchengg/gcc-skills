<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" rx="36" fill="#0b1522"/><text x="70" y="90" font-family="PingFang SC,sans-serif" font-size="42" font-weight="700" fill="#fff">八步发布流程：四步生产，四步验收</text><g font-family="PingFang SC,sans-serif" font-size="25"><g fill="#152536" stroke="#64748b"><rect x="70" y="150" width="245" height="170" rx="22"/><rect x="340" y="150" width="245" height="170" rx="22"/><rect x="610" y="150" width="245" height="170" rx="22"/><rect x="880" y="150" width="245" height="170" rx="22"/></g><g fill="#10291f" stroke="#4ade80"><rect x="70" y="400" width="245" height="170" rx="22"/><rect x="340" y="400" width="245" height="170" rx="22"/><rect x="610" y="400" width="245" height="170" rx="22"/><rect x="880" y="400" width="245" height="170" rx="22"/></g><g fill="#4ade80" font-size="40" font-weight="700"><text x="95" y="205">01</text><text x="365" y="205">02</text><text x="635" y="205">03</text><text x="905" y="205">04</text><text x="95" y="455">05</text><text x="365" y="455">06</text><text x="635" y="455">07</text><text x="905" y="455">08</text></g><g fill="#fff"><text x="95" y="260">检查本地图片</text><text x="365" y="260">生成内联 HTML</text><text x="635" y="260">嵌入全部图片</text><text x="905" y="260">校验最终 HTML</text><text x="95" y="510">生成复制预览</text><text x="365" y="510">渲染手机长图</text><text x="635" y="510">复核原稿哈希</text><text x="905" y="510">脱敏与隐私扫描</text></g><text x="70" y="670" fill="#86efac" font-size="28">后四步不改变外观，却决定这份产物是否真的可以发布。</text></g></svg>
