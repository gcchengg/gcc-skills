<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" rx="36" fill="#0b1522"/><text x="70" y="90" font-family="PingFang SC,sans-serif" font-size="42" font-weight="700" fill="#fff">一次运行，交付四类可复核证据</text><g font-family="PingFang SC,sans-serif"><g fill="#152536" stroke="#4ade80"><rect x="70" y="150" width="500" height="210" rx="26"/><rect x="630" y="150" width="500" height="210" rx="26"/><rect x="70" y="410" width="500" height="210" rx="26"/><rect x="630" y="410" width="500" height="210" rx="26"/></g><g fill="#4ade80" font-size="30" font-weight="700"><text x="110" y="215">01 · 复制预览页</text><text x="670" y="215">02 · 发布稳定版</text><text x="110" y="475">03 · 390px 手机长图</text><text x="670" y="475">04 · 检查与审计报告</text></g><g fill="#cbd5e1" font-size="25"><text x="110" y="270">富文本复制按钮</text><text x="110" y="312">先看，再粘贴</text><text x="670" y="270">图片嵌入 HTML</text><text x="670" y="312">脱离本机路径也能打开</text><text x="110" y="530">完整页面，不只首屏</text><text x="110" y="572">横向溢出 0 / 破图 0</text><text x="670" y="530">原稿哈希 / HTML 校验</text><text x="670" y="572">隐私扫描 / 图片证据表</text></g><text x="70" y="690" font-size="28" fill="#86efac">“有预览”改善体验，“有证据”建立可信性。</text></g></svg>
