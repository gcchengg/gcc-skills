<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <rect width="1200" height="980" rx="42" fill="#07111f"/>
  <g font-family="PingFang SC, sans-serif"><text x="70" y="96" fill="#fff" font-size="48" font-weight="700">一份 Skill 里应该放什么？</text><text x="70" y="150" fill="#8fb5d7" font-size="25">从最小可用开始，用到什么再增加什么</text>
  <g transform="translate(70 215)"><rect width="380" height="620" rx="30" fill="#102945"/><text x="38" y="72" fill="#52b8ff" font-size="34" font-weight="700">your-skill/</text><text x="45" y="145" fill="#fff" font-size="29">├── SKILL.md</text><text x="45" y="205" fill="#fff" font-size="29">├── agents/</text><text x="75" y="255" fill="#bcd0e2" font-size="27">└── openai.yaml</text><text x="45" y="325" fill="#fff" font-size="29">├── scripts/</text><text x="45" y="395" fill="#fff" font-size="29">├── references/</text><text x="45" y="465" fill="#fff" font-size="29">└── assets/</text><rect x="38" y="520" width="300" height="54" rx="27" fill="#1264a3"/><text x="188" y="557" text-anchor="middle" fill="#fff" font-size="24">最小只需 SKILL.md</text></g>
  <g transform="translate(510 215)" font-size="25"><g><rect width="620" height="108" rx="22" fill="#0d2139" stroke="#2ca7ff"/><text x="28" y="45" fill="#58bdff" font-weight="700">SKILL.md</text><text x="28" y="80" fill="#d3e2ef">触发条件、工作步骤、质量标准</text></g><g transform="translate(0 128)"><rect width="620" height="108" rx="22" fill="#0d2139" stroke="#54c7b4"/><text x="28" y="45" fill="#75d7c7" font-weight="700">agents/openai.yaml</text><text x="28" y="80" fill="#d3e2ef">界面名称、简介和默认提示</text></g><g transform="translate(0 256)"><rect width="620" height="108" rx="22" fill="#0d2139" stroke="#9b82f5"/><text x="28" y="45" fill="#b49eff" font-weight="700">scripts / references</text><text x="28" y="80" fill="#d3e2ef">稳定代码 / 按需读取的长资料</text></g><g transform="translate(0 384)"><rect width="620" height="108" rx="22" fill="#0d2139" stroke="#f6a64a"/><text x="28" y="45" fill="#ffc06f" font-weight="700">assets</text><text x="28" y="80" fill="#d3e2ef">交付时会复用的模板、图片和字体</text></g><text x="0" y="565" fill="#8fb5d7">空目录不会让 Skill 更专业，只会增加噪声。</text></g></g>
</svg>
