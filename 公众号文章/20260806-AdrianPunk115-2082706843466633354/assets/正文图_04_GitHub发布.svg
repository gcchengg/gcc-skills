<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980"><rect width="1200" height="980" rx="42" fill="#07111f"/><g font-family="PingFang SC, sans-serif"><text x="70" y="96" fill="#fff" font-size="48" font-weight="700">上传 GitHub 前，先过安全闸门</text><text x="70" y="150" fill="#8fb5d7" font-size="25">版本管理是放大器：既放大复用，也会放大泄露</text>
<g transform="translate(70 220)"><rect width="1060" height="240" rx="30" fill="#0d223a" stroke="#2ca7ff" stroke-width="3"/><text x="40" y="65" fill="#5bbcff" font-size="28" font-weight="700">标准上传路径</text><text x="40" y="125" fill="#fff" font-size="27">git init -b main  →  git add .  →  git commit  →  git remote add  →  git push</text><text x="40" y="185" fill="#9dc7e8" font-size="24">后续更新：git add .  →  git commit  →  git push</text></g>
<g transform="translate(70 510)"><rect width="1060" height="330" rx="30" fill="#241e2b" stroke="#f05b68" stroke-width="3"/><text x="40" y="65" fill="#ff8790" font-size="29" font-weight="700">公开前必须删除或隔离</text><g fill="#f0d8dc" font-size="26"><text x="40" y="125">API Key　·　Token　·　密码与账号</text><text x="40" y="180">客户数据　·　公司内部地址　·　未公开业务规则</text><text x="40" y="250">提交前检查：git status ＋ git diff --cached</text></g></g><text x="600" y="915" text-anchor="middle" fill="#ff9ba3" font-size="28">不确定时先用 Private，确认无敏感信息再公开</text></g></svg>
