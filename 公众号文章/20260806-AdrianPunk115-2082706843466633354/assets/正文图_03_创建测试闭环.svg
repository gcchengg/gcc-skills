<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980"><rect width="1200" height="980" rx="42" fill="#07111f"/><g font-family="PingFang SC, sans-serif"><text x="70" y="96" fill="#fff" font-size="48" font-weight="700">从创建到跑通：四步闭环</text><text x="70" y="150" fill="#8fb5d7" font-size="25">结构校验只是起点，真实任务测试才决定质量</text>
  <g transform="translate(70 230)">
    <g><rect width="500" height="245" rx="28" fill="#0d2846" stroke="#2ca7ff" stroke-width="3"/><text x="35" y="58" fill="#55baff" font-size="25">01 初始化</text><text x="35" y="110" fill="#fff" font-size="33" font-weight="700">调用 skill-creator</text><text x="35" y="160" fill="#c8d9e8" font-size="24">生成 SKILL.md 与 openai.yaml</text><text x="35" y="202" fill="#7fc8f7" font-size="22">名称仅用小写、数字、连字符</text></g>
    <g transform="translate(560 0)"><rect width="500" height="245" rx="28" fill="#10263f" stroke="#58cbb8" stroke-width="3"/><text x="35" y="58" fill="#75d7c7" font-size="25">02 编写</text><text x="35" y="110" fill="#fff" font-size="33" font-weight="700">触发、流程、异常、验收</text><text x="35" y="160" fill="#c8d9e8" font-size="24">description 决定是否触发</text><text x="35" y="202" fill="#91d8cc" font-size="22">正文是执行手册，不是宣传文案</text></g>
    <g transform="translate(0 300)"><rect width="500" height="245" rx="28" fill="#1c2140" stroke="#9b82f5" stroke-width="3"/><text x="35" y="58" fill="#b49eff" font-size="25">03 验证与安装</text><text x="35" y="110" fill="#fff" font-size="33" font-weight="700">校验结构 → 安装目录</text><text x="35" y="160" fill="#c8d9e8" font-size="24">检查 YAML、命名和必需文件</text><text x="35" y="202" fill="#b9aaff" font-size="22">安装到 ~/.codex/skills/</text></g>
    <g transform="translate(560 300)"><rect width="500" height="245" rx="28" fill="#302238" stroke="#f5a64c" stroke-width="3"/><text x="35" y="58" fill="#ffc274" font-size="25">04 真实测试</text><text x="35" y="110" fill="#fff" font-size="33" font-weight="700">明确 / 自然 / 缺失信息</text><text x="35" y="160" fill="#c8d9e8" font-size="24">测执行、自动触发和不乱编</text><text x="35" y="202" fill="#ffca8a" font-size="22">根据失败位置迭代对应层</text></g>
    <path d="M500 123h60M530 245v55M560 423h-60" stroke="#3caeff" stroke-width="7" stroke-linecap="round"/>
  </g><text x="600" y="870" text-anchor="middle" fill="#5cbdff" font-size="28">验证通过 ≠ 工作流好用，真实测试才是验收</text></g></svg>
