<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <rect width="1200" height="980" rx="42" fill="#07111f"/>
  <g font-family="PingFang SC, sans-serif"><text x="70" y="95" fill="#fff" font-size="48" font-weight="700">先别写 Skill，先填工作流卡片</text><text x="70" y="148" fill="#8fb5d7" font-size="25">填不完整，说明流程还没有稳定到值得固化</text>
  <g transform="translate(70 210)">
    <rect width="1060" height="650" rx="30" fill="#0d2139" stroke="#258ee8" stroke-width="3"/>
    <g font-size="27"><text x="42" y="62" fill="#50b7ff">01  什么时候启动？</text><text x="560" y="62" fill="#50b7ff">02  用户会提供什么？</text><text x="42" y="170" fill="#75d3c3">03  固定步骤是什么？</text><text x="560" y="170" fill="#75d3c3">04  最终输出什么？</text><text x="42" y="278" fill="#b99aff">05  什么结果算合格？</text><text x="560" y="278" fill="#b99aff">06  信息不足怎么办？</text></g>
    <g fill="#d7e5f2" font-size="25"><text x="42" y="105">周报、复盘、工作回顾</text><text x="560" y="105">成果、问题、数据、计划</text><text x="42" y="213">提取 → 分类 → 合并 → 行动 → 检查</text><text x="560" y="213">结构化复盘＋行动表</text><text x="42" y="321">不虚构；保留数据；行动可验收</text><text x="560" y="321">标记待补充；最多问 3 个问题</text></g>
    <path d="M42 375H1018" stroke="#24415e" stroke-width="2"/><text x="42" y="435" fill="#fff" font-size="31" font-weight="700">每周复盘示例</text>
    <g fill="#bdd2e5" font-size="25"><text x="42" y="490">输入：一周的零散记录、故障、数据和未完成事项</text><text x="42" y="540">处理：只提取事实，把问题转成带优先级的下一步</text><text x="42" y="590">输出：成果 / 进展 / 问题与原因 / 经验 / 行动</text></g>
  </g><text x="600" y="920" text-anchor="middle" fill="#55baff" font-size="28">不要把混乱包装成 Skill，先把工作流本身想清楚</text></g>
</svg>
