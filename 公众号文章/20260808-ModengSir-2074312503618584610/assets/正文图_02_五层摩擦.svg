<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020"><rect width="1200" height="1020" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="50" font-family="Arial,'PingFang SC'" font-weight="800">工具能否被采用，取决于五层摩擦</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">每多一步，能力进入日常工作的概率就更低</text><g font-family="Arial,'PingFang SC'"><g><rect x="90" y="210" width="1020" height="120" rx="24" fill="#123052"/><rect x="130" y="350" width="940" height="120" rx="24" fill="#15435c"/><rect x="170" y="490" width="860" height="120" rx="24" fill="#175868"/><rect x="210" y="630" width="780" height="120" rx="24" fill="#23635d"/><rect x="250" y="770" width="700" height="120" rx="24" fill="#554537"/></g><g fill="#fff" font-size="34" font-weight="800" text-anchor="middle"><text x="600" y="262">入口：素材怎样进入任务？</text><text x="600" y="402">表达：必须先学习多少术语？</text><text x="600" y="542">时间：能否适应碎片化节奏？</text><text x="600" y="682">配置：常见流程是否开箱可用？</text><text x="600" y="822">信任：数据、权限、稳定是否透明？</text></g><g fill="#c9dbea" font-size="22" text-anchor="middle"><text x="600" y="302">导出、上传、下载和回传都是搬运税</text><text x="600" y="442">专业概念必须换来足够收益</text><text x="600" y="582">手机不只是查看，还要能审批和接续</text><text x="600" y="722">模板降低起步成本，平台提高可塑上限</text><text x="600" y="862">安全应看真实数据流，而不是品牌印象</text></g></g><text x="600" y="960" fill="#60cfff" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">生产力 = 能力 × 采用率 × 可靠性</text></svg>
