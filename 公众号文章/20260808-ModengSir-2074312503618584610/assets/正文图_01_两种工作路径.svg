<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920"><rect width="1200" height="920" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="50" font-family="Arial,'PingFang SC'" font-weight="800">两种工作路径：随时发起 vs 深入执行</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">不是强弱排名，而是主要阻力发生在哪里</text><g font-family="Arial,'PingFang SC'"><rect x="70" y="210" width="500" height="560" rx="30" fill="#143b3f" stroke="#49ccb0" stroke-width="3"/><rect x="630" y="210" width="500" height="560" rx="30" fill="#122f50" stroke="#31aaff" stroke-width="3"/><text x="320" y="280" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">低入口摩擦</text><text x="880" y="280" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">高执行深度</text><g fill="#c9dbea" font-size="28"><text x="115" y="355">• 文字 / 语音 / 图片 / 文件</text><text x="115" y="415">• 手机随时派发与跟进</text><text x="115" y="475">• 常见办公模板更快起步</text><text x="115" y="535">• 贴近日常沟通入口</text><text x="675" y="355">• 项目文件与长期上下文</text><text x="675" y="415">• 插件、脚本与复杂自动化</text><text x="675" y="475">• 终端与可审查执行环境</text><text x="675" y="535">• 手机 Remote 持续跟进</text></g><text x="320" y="680" fill="#5fe0bd" font-size="30" font-weight="800" text-anchor="middle">想到 → 立即交代</text><text x="880" y="680" fill="#62cfff" font-size="30" font-weight="800" text-anchor="middle">配置 → 深度完成</text></g><text x="600" y="850" fill="#f0b44c" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">先问：我的瓶颈在入口，还是在执行复杂度？</text></svg>
