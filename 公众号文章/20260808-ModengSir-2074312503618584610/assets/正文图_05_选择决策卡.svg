<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980"><rect width="1200" height="980" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="50" font-family="Arial,'PingFang SC'" font-weight="800">AI 工具选择决策卡</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">用真实任务回答四问，不要只比参数</text><g font-family="Arial,'PingFang SC'"><g fill="#112d4a" stroke="#31aaff" stroke-width="3"><rect x="70" y="210" width="1060" height="145" rx="24"/><rect x="70" y="385" width="1060" height="145" rx="24"/><rect x="70" y="560" width="1060" height="145" rx="24"/><rect x="70" y="735" width="1060" height="145" rx="24"/></g><g fill="#62cfff" font-size="31" font-weight="800"><text x="110" y="270">01 上下文</text><text x="110" y="445">02 配置</text><text x="110" y="620">03 设备</text><text x="110" y="795">04 信任</text></g><g fill="#fff" font-size="28"><text x="330" y="270">素材主要在聊天、手机，还是项目文件和工具链？</text><text x="330" y="445">要开箱即用，还是愿意搭建长期工作系统？</text><text x="330" y="620">手机能否发起、审批、接续并查看真实状态？</text><text x="330" y="795">文件如何流动？谁有权限？失败时如何恢复？</text></g><g fill="#9fb8cc" font-size="22"><text x="330" y="315">最短入口和最深执行，可能需要不同工具</text><text x="330" y="490">模板降低首日成本，平台提高长期上限</text><text x="330" y="665">不要只看“有手机端”这个标签</text><text x="330" y="840">用数据流和权限表替代安全印象</text></g></g><text x="600" y="935" fill="#53d4b6" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">选择能缩短最长路径，同时保留控制权的工具</text></svg>
