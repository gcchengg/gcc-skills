<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100"><rect width="1200" height="1100" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="50" font-family="Arial,'PingFang SC'" font-weight="800">创作者最值得自动化的，不只是写文案</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">四类高频杂活，必须配套验收与审批</text><g font-family="Arial,'PingFang SC'"><g><rect x="70" y="200" width="505" height="365" rx="28" fill="#112e4c" stroke="#31aaff" stroke-width="3"/><rect x="625" y="200" width="505" height="365" rx="28" fill="#143d43" stroke="#49ccb0" stroke-width="3"/><rect x="70" y="610" width="505" height="365" rx="28" fill="#2b294c" stroke="#8c7dff" stroke-width="3"/><rect x="625" y="610" width="505" height="365" rx="28" fill="#3c2c37" stroke="#f0aa48" stroke-width="3"/></g><g fill="#fff" font-size="35" font-weight="800"><text x="110" y="260">内容准备</text><text x="665" y="260">用户互动</text><text x="110" y="670">数据复盘</text><text x="665" y="670">发布运营</text></g><g fill="#c9dbea" font-size="26"><text x="110" y="320">• 选题与素材整理</text><text x="110" y="372">• 脚本、标题与字幕</text><text x="110" y="424">• 错别字与术语校对</text><text x="110" y="476">• 品牌语气检查</text><text x="665" y="320">• 高频问题汇总</text><text x="665" y="372">• 回复优先级</text><text x="665" y="424">• 抽奖候选名单</text><text x="665" y="476">• 反馈分类</text><text x="110" y="730">• 指标口径统一</text><text x="110" y="782">• 异常波动标记</text><text x="110" y="834">• 周报与实验建议</text><text x="110" y="886">• 来源与时间范围</text><text x="665" y="730">• 热点与更新提醒</text><text x="665" y="782">• 多平台发布检查</text><text x="665" y="834">• 完成状态记录</text><text x="665" y="886">• 失败主动告警</text></g></g><text x="600" y="1040" fill="#f0b44c" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">发送、公布、敏感回复与正式数据修改仍需人工确认</text></svg>
