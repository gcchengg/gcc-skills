<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" rx="38" fill="#071526"/><text x="65" y="88" fill="#fff" font-family="PingFang SC" font-size="43" font-weight="800">搜索是“找”，浏览器是“做”</text><text x="65" y="136" fill="#86A5C7" font-family="PingFang SC" font-size="23">先用最小权限完成任务；只有需要登录态动作时，才交出浏览器控制权</text><g font-family="PingFang SC"><rect x="70" y="205" width="500" height="380" rx="30" fill="#0E304F" stroke="#58DFFF" stroke-width="2"/><text x="110" y="275" fill="#63E2FF" font-size="34" font-weight="800">ModSearch</text><text x="110" y="332" fill="#fff" font-size="25">找资料、原帖和公开页面</text><text x="110" y="390" fill="#C3D9EA" font-size="22">Firecrawl · Tavily · Exa · X</text><text x="110" y="455" fill="#C3D9EA" font-size="22">可能需要外部 API Key</text><text x="110" y="520" fill="#7CE8FF" font-size="22" font-weight="700">主要风险：来源真伪与数据传输</text><rect x="630" y="205" width="500" height="380" rx="30" fill="#2D2853" stroke="#9F88FF" stroke-width="2"/><text x="670" y="275" fill="#AE9AFF" font-size="34" font-weight="800">dsh-browser</text><text x="670" y="332" fill="#fff" font-size="25">点击、输入、填表、查后台</text><text x="670" y="390" fill="#D4CDF7" font-size="22">复用 Chrome Cookie 与 Session</text><text x="670" y="455" fill="#D4CDF7" font-size="22">默认对关键动作弹确认</text><text x="670" y="520" fill="#B7A7FF" font-size="22" font-weight="700">主要风险：已登录账号的操作权</text></g><text x="600" y="655" text-anchor="middle" fill="#B8CDE0" font-family="PingFang SC" font-size="24">能用搜索解决，就不先授权操作；能读取解决，就不先授权写入</text></svg>
