<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" rx="38" fill="#071526"/><text x="65" y="88" fill="#fff" font-family="PingFang SC" font-size="43" font-weight="800">Agent Teams：一个队长，多个可复用的专业成员</text><text x="65" y="136" fill="#86A5C7" font-family="PingFang SC" font-size="23">适合可以真正并行、结果需要统一汇总的任务</text><g font-family="PingFang SC" text-anchor="middle"><rect x="435" y="190" width="330" height="120" rx="30" fill="#392E68" stroke="#9D85FF"/><text x="600" y="242" fill="#B3A1FF" font-size="30" font-weight="800">CAPTAIN</text><text x="600" y="280" fill="#fff" font-size="22">拆解·分配·汇总</text><g fill="#103B5D" stroke="#58DFFF"><rect x="80" y="425" width="300" height="150" rx="28"/><rect x="450" y="425" width="300" height="150" rx="28"/><rect x="820" y="425" width="300" height="150" rx="28"/></g><g fill="#fff" font-size="28" font-weight="800"><text x="230" y="486">Frontend</text><text x="600" y="486">Performance</text><text x="970" y="486">Engineering</text></g><g fill="#A8C7E0" font-size="21"><text x="230" y="530">界面与交互</text><text x="600" y="530">速度与 WebGL 降级</text><text x="970" y="530">代码质量与架构</text></g></g><g stroke="#68DFFF" stroke-width="4"><path d="M525 310L230 425"/><path d="M600 310V425"/><path d="M675 310L970 425"/></g><rect x="260" y="625" width="680" height="58" rx="29" fill="#193C36"/><text x="600" y="663" text-anchor="middle" fill="#62E4BA" font-family="PingFang SC" font-size="23" font-weight="700">后续可只唤醒指定成员，不必重复调度全队</text></svg>
