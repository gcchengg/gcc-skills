<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" rx="38" fill="#071526"/><text x="65" y="88" fill="#fff" font-family="PingFang SC" font-size="43" font-weight="800">找到插件，不等于可以安全安装</text><text x="65" y="136" fill="#86A5C7" font-family="PingFang SC" font-size="23">三个发现入口都是索引，不是官方审核结论</text><g font-family="PingFang SC" text-anchor="middle"><rect x="65" y="215" width="295" height="190" rx="28" fill="#0E304F"/><text x="212" y="275" fill="#62E0FF" font-size="29" font-weight="800">GitHub Topic</text><text x="212" y="326" fill="#fff" font-size="23">更新最快·质量混杂</text><rect x="452" y="215" width="295" height="190" rx="28" fill="#2D2853"/><text x="599" y="275" fill="#AA98FF" font-size="29" font-weight="800">Awesome 清单</text><text x="599" y="326" fill="#fff" font-size="23">分类更清晰·社区维护</text><rect x="840" y="215" width="295" height="190" rx="28" fill="#153B35"/><text x="987" y="275" fill="#67EAC0" font-size="29" font-weight="800">dsh-market</text><text x="987" y="326" fill="#fff" font-size="23">可搜索推荐·仍需核验</text><path d="M212 425V480H987V425" fill="none" stroke="#58DFFF" stroke-width="4"/><rect x="225" y="480" width="750" height="150" rx="30" fill="#342D20" stroke="#F0AE48"/><text x="600" y="535" fill="#FFC56E" font-size="28" font-weight="800">Agent 读 README → 你检查权限 → Git 留回滚点</text><text x="600" y="584" fill="#fff" font-size="22">自动安装只省操作，不省安全责任</text></g></svg>
