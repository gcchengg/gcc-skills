<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" rx="38" fill="#071526"/><text x="70" y="92" fill="#fff" font-family="PingFang SC" font-size="44" font-weight="800">作品集别堆工具，做三个真闭环</text><text x="70" y="140" fill="#7D9BBF" font-family="PingFang SC" font-size="24">每一个项目都要同时有数据输入、AI 处理、人工审核、系统写回和结果指标</text>
<g font-family="PingFang SC"><rect x="70" y="215" width="330" height="390" rx="30" fill="#0E2F4D"/><circle cx="125" cy="275" r="30" fill="#38CBFF"/><text x="125" y="286" text-anchor="middle" fill="#071526" font-size="29" font-weight="800">1</text><text x="175" y="287" fill="#fff" font-size="32" font-weight="800">AI 客服</text><text x="110" y="360" fill="#D7E9FA" font-size="23">企业文档 → 检索回答</text><text x="110" y="412" fill="#D7E9FA" font-size="23">不确定 → 转人工</text><text x="110" y="464" fill="#D7E9FA" font-size="23">对话 → 日志与 Eval</text><text x="110" y="548" fill="#7CEBFF" font-size="22" font-weight="700">指标：解决率·正确率</text>
<rect x="435" y="215" width="330" height="390" rx="30" fill="#2F2A1D"/><circle cx="490" cy="275" r="30" fill="#F5B643"/><text x="490" y="286" text-anchor="middle" fill="#071526" font-size="29" font-weight="800">2</text><text x="540" y="287" fill="#fff" font-size="32" font-weight="800">AI 销售</text><text x="475" y="360" fill="#FFF3DA" font-size="23">客户 → 会前简报</text><text x="475" y="412" fill="#FFF3DA" font-size="23">会议 → 纪要与邮件</text><text x="475" y="464" fill="#FFF3DA" font-size="23">CRM → 更新与提醒</text><text x="475" y="548" fill="#F5C76E" font-size="22" font-weight="700">指标：准备时间·跟进率</text>
<rect x="800" y="215" width="330" height="390" rx="30" fill="#13332D"/><circle cx="855" cy="275" r="30" fill="#47E6B1"/><text x="855" y="286" text-anchor="middle" fill="#071526" font-size="29" font-weight="800">3</text><text x="905" y="287" fill="#fff" font-size="32" font-weight="800">AI 内容</text><text x="840" y="360" fill="#E4FFF6" font-size="23">研究 → 大纲与写作</text><text x="840" y="412" fill="#E4FFF6" font-size="23">文章 → 配图与排版</text><text x="840" y="464" fill="#E4FFF6" font-size="23">审核 → 存稿与发布</text><text x="840" y="548" fill="#72F0C5" font-size="22" font-weight="700">指标：周期·品质·稳定性</text></g>
<text x="600" y="672" text-anchor="middle" fill="#B4C9DE" font-family="PingFang SC" font-size="24">展示问题、旧流程、方案、效果，以及你如何从失败中修正系统</text></svg>
