<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" rx="38" fill="#071526"/><text x="70" y="92" fill="#fff" font-family="PingFang SC" font-size="44" font-weight="800">六个月，从 AI 用户走到业务落地</text><text x="70" y="140" fill="#7D9BBF" font-family="PingFang SC" font-size="24">每个月只升一级：先做真任务，再连流程，最后用结果证明能力</text>
<path d="M110 385H1090" stroke="#1E567F" stroke-width="10" stroke-linecap="round"/><g font-family="PingFang SC" text-anchor="middle"><g><circle cx="120" cy="385" r="44" fill="#38CBFF"/><text x="120" y="396" fill="#071526" font-size="28" font-weight="800">M1</text><text x="120" y="475" fill="#fff" font-size="24" font-weight="700">AI 重度用户</text><text x="120" y="515" fill="#7D9BBF" font-size="19">每天一个真任务</text></g><g><circle cx="312" cy="385" r="44" fill="#46B9ED"/><text x="312" y="396" fill="#071526" font-size="28" font-weight="800">M2</text><text x="312" y="475" fill="#fff" font-size="24" font-weight="700">自动化流程</text><text x="312" y="515" fill="#7D9BBF" font-size="19">连接表单、AI、CRM</text></g><g><circle cx="504" cy="385" r="44" fill="#5AA5DA"/><text x="504" y="396" fill="#071526" font-size="28" font-weight="800">M3</text><text x="504" y="475" fill="#fff" font-size="24" font-weight="700">代码与 API</text><text x="504" y="515" fill="#7D9BBF" font-size="19">理解数据如何流动</text></g><g><circle cx="696" cy="385" r="44" fill="#F5B643"/><text x="696" y="396" fill="#071526" font-size="28" font-weight="800">M4</text><text x="696" y="475" fill="#fff" font-size="24" font-weight="700">第一个真应用</text><text x="696" y="515" fill="#7D9BBF" font-size="19">解决自己的高频问题</text></g><g><circle cx="888" cy="385" r="44" fill="#67D4B1"/><text x="888" y="396" fill="#071526" font-size="28" font-weight="800">M5</text><text x="888" y="475" fill="#fff" font-size="24" font-weight="700">真实用户</text><text x="888" y="515" fill="#7D9BBF" font-size="19">让反馈进入系统</text></g><g><circle cx="1080" cy="385" r="44" fill="#47E6B1"/><text x="1080" y="396" fill="#071526" font-size="28" font-weight="800">M6</text><text x="1080" y="475" fill="#fff" font-size="24" font-weight="700">案例与指标</text><text x="1080" y="515" fill="#7D9BBF" font-size="19">用结果证明能力</text></g></g>
<rect x="150" y="590" width="900" height="70" rx="35" fill="#EAF3FF"/><text x="600" y="636" text-anchor="middle" fill="#071526" font-family="PingFang SC" font-size="28" font-weight="800">AI 用户 → 流程搭建者 → 系统实施者 → 行业落地者</text></svg>
