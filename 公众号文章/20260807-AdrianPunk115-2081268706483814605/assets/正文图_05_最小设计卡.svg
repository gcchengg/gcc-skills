<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980"><rect width="1200" height="980" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="52" font-family="Arial,'PingFang SC'" font-weight="800">最小 Graph 设计卡</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">先在纸上回答五组问题，再选择框架</text><g font-family="Arial,'PingFang SC'"><g fill="#112d4a" stroke="#2faeff" stroke-width="3"><rect x="70" y="205" width="1060" height="120" rx="24"/><rect x="70" y="350" width="1060" height="120" rx="24"/><rect x="70" y="495" width="1060" height="120" rx="24"/><rect x="70" y="640" width="1060" height="120" rx="24"/><rect x="70" y="785" width="1060" height="120" rx="24"/></g><g fill="#5bcbff" font-size="30" font-weight="800"><text x="110" y="275">01 交付物</text><text x="110" y="420">02 节点</text><text x="110" y="565">03 边</text><text x="110" y="710">04 状态</text><text x="110" y="855">05 停止</text></g><g fill="#fff" font-size="28"><text x="330" y="275">最终要产出什么，怎样才算合格？</text><text x="330" y="420">哪些角色 / 模型 / 工具必须独立存在？</text><text x="330" y="565">怎样交接，哪里并行，哪里条件回退？</text><text x="330" y="710">哪些字段流动，每个节点读什么、写什么？</text><text x="330" y="855">成功、失败、超时、超预算何时结束？</text></g></g></svg>
