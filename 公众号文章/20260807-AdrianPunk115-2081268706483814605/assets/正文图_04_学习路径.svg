<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940"><rect width="1200" height="940" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="52" font-family="Arial,'PingFang SC'" font-weight="800">从 Loop 到 Graph：四阶段学习路径</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">先让单个节点可靠，再组合复杂系统</text><g font-family="Arial,'PingFang SC'"><g><rect x="80" y="680" width="310" height="140" rx="24" fill="#123052"/><rect x="300" y="505" width="350" height="140" rx="24" fill="#15435b"/><rect x="520" y="330" width="390" height="140" rx="24" fill="#17606a"/><rect x="740" y="155" width="390" height="140" rx="24" fill="#197878"/></g><g fill="#fff" font-size="31" font-weight="800"><text x="110" y="730">01 练好 Loop</text><text x="330" y="555">02 纸上画图</text><text x="550" y="380">03 定义状态</text><text x="770" y="205">04 组合小 Graph</text></g><g fill="#c8dbea" font-size="22"><text x="110" y="775">检查·停止·验收</text><text x="330" y="600">每个节点为存在辩护</text><text x="550" y="425">说清每个节点读写</text><text x="770" y="250">阶段之间清晰交接</text></g></g><text x="600" y="875" fill="#f2aa4b" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">一堆弱 Loop 组成的 Graph，只是把失败分布式了</text></svg>
