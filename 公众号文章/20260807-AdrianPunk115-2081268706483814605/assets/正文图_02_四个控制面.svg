<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960"><rect width="1200" height="960" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="52" font-family="Arial,'PingFang SC'" font-weight="800">可运行的 Graph，需要四个控制面</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">图不是重点，约束不确定节点才是重点</text><g font-family="Arial,'PingFang SC'"><g><rect x="70" y="220" width="500" height="280" rx="28" fill="#123052" stroke="#2faeff" stroke-width="3"/><rect x="630" y="220" width="500" height="280" rx="28" fill="#153d49" stroke="#43ccb4" stroke-width="3"/><rect x="70" y="550" width="500" height="280" rx="28" fill="#29284c" stroke="#8a7cff" stroke-width="3"/><rect x="630" y="550" width="500" height="280" rx="28" fill="#3e2b37" stroke="#f2aa4b" stroke-width="3"/></g><g fill="#fff" font-size="38" font-weight="800"><text x="110" y="285">节点 NODE</text><text x="670" y="285">状态 STATE</text><text x="110" y="615">路由 ROUTING</text><text x="670" y="615">审阅 REVIEW</text></g><g fill="#c9dbea" font-size="26"><text x="110" y="345">• 职责窄、边界清晰</text><text x="110" y="395">• 输入输出可描述</text><text x="110" y="445">• 独立存在有真实价值</text><text x="670" y="345">• 结构化字段</text><text x="670" y="395">• 字段所有权</text><text x="670" y="445">• 检查点与版本记录</text><text x="110" y="675">• 确定条件用代码</text><text x="110" y="725">• 模糊判断才用 AI</text><text x="110" y="775">• 保存路由理由</text><text x="670" y="675">• 干净上下文</text><text x="670" y="725">• 异构模型 / 外部证据</text><text x="670" y="775">• 多读单写</text></g></g><text x="600" y="900" fill="#61cfff" font-size="30" font-family="Arial,'PingFang SC'" text-anchor="middle">少节点、强状态、硬路由、独立验证</text></svg>
