<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040"><rect width="1200" height="1040" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="52" font-family="Arial,'PingFang SC'" font-weight="800">三种最小 Graph，掌握三类协作模式</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">顺序交接、条件回退、并行汇合</text><g font-family="Arial,'PingFang SC'"><rect x="70" y="210" width="1060" height="220" rx="26" fill="#102d4c"/><rect x="70" y="465" width="1060" height="220" rx="26" fill="#153e48"/><rect x="70" y="720" width="1060" height="220" rx="26" fill="#2c294c"/><g fill="#fff" font-size="34" font-weight="800"><text x="110" y="270">文章：顺序 + 审阅回退</text><text x="110" y="525">代码：测试驱动的条件分支</text><text x="110" y="780">调研：并行搜索 + 汇总核查</text></g><g fill="#c8dbea" font-size="28"><text x="110" y="350">研究　→　写作　→　审阅　→　通过</text><text x="640" y="395" fill="#f2aa4b">不通过 ↩ 写作（≤2 次）</text><text x="110" y="605">理解　→　执行　→　测试　→　通过</text><text x="640" y="650" fill="#f2aa4b">失败 → 修复 ↩ 测试（≤3 次）</text><text x="110" y="855">5 个方向并行　→　汇总去重　→　事实核查</text><text x="640" y="900" fill="#56d3ba">全部完成后才汇合</text></g></g></svg>
