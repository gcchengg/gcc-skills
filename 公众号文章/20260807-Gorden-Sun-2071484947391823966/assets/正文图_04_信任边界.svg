<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930"><rect width="1200" height="930" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="50" font-family="Arial,'PingFang SC'" font-weight="800">把 AI 放进工作流，先画清信任边界</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">权限越接近外部影响，人工审批越不能省</text>
<g font-family="Arial,'PingFang SC'"><rect x="100" y="210" width="1000" height="120" rx="24" fill="#12395c"/><rect x="180" y="370" width="840" height="120" rx="24" fill="#175367"/><rect x="260" y="530" width="680" height="120" rx="24" fill="#3b533f"/><rect x="340" y="690" width="520" height="120" rx="24" fill="#684232"/>
<g fill="#fff" font-size="34" font-weight="800" text-anchor="middle"><text x="600" y="265">可直接做：搜索、整理、起草、列清单</text><text x="600" y="425">需提示：生成文件、更新项目状态</text><text x="600" y="585">需审批：发消息、改正式资料、创建任务</text><text x="600" y="745">高风险：删除、公开发布、付款与承诺</text></g>
<g fill="#c7dbea" font-size="22" text-anchor="middle"><text x="600" y="305">结果可逆，影响只在工作区内</text><text x="600" y="465">保留变更记录，允许撤销</text><text x="600" y="625">动作影响他人或正式系统</text><text x="600" y="785">必须由有责任的人最终确认</text></g></g>
<text x="600" y="875" fill="#f5b84b" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">最小权限 + 来源核验 + 真实场景验收 + 明确负责人</text></svg>
