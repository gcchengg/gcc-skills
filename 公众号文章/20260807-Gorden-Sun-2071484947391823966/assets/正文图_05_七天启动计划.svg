<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><rect width="1200" height="940" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="50" font-family="Arial,'PingFang SC'" font-weight="800">七天启动：从一次真实任务开始</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">每一天只增加一层复杂度</text>
<line x1="150" y1="250" x2="150" y2="810" stroke="#2c9ef2" stroke-width="8"/><g font-family="Arial,'PingFang SC'"><g fill="#2c9ef2"><circle cx="150" cy="250" r="18"/><circle cx="150" cy="340" r="18"/><circle cx="150" cy="430" r="18"/><circle cx="150" cy="520" r="18"/><circle cx="150" cy="610" r="18"/><circle cx="150" cy="700" r="18"/><circle cx="150" cy="790" r="18"/></g>
<g fill="#fff" font-size="31" font-weight="800"><text x="205" y="260">Day 1　观察：找重复、烦琐、跨系统的任务</text><text x="205" y="350">Day 2　连接：选择两个关键来源做小实验</text><text x="205" y="440">Day 3　建档：写角色、偏好、规则和边界</text><text x="205" y="530">Day 4　单次：完成一个低风险真实任务</text><text x="205" y="620">Day 5　整合：从多个来源合成一个输出</text><text x="205" y="710">Day 6　沉淀：把有效步骤写成检查清单</text><text x="205" y="800">Day 7　决策：满足可重复、低风险、可检查再自动化</text></g></g>
<text x="600" y="885" fill="#55c8ff" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">先形成可靠闭环，再追求自动运行</text></svg>
