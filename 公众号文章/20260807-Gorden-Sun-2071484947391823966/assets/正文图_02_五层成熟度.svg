<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960"><rect width="1200" height="960" rx="38" fill="#07111f"/><text x="70" y="90" fill="#fff" font-size="50" font-family="Arial,'PingFang SC'" font-weight="800">五层成熟度：先建立信任，再增加自治</text><text x="70" y="140" fill="#8fb8d9" font-size="25" font-family="Arial,'PingFang SC'">不是能力排名，而是风险与复杂度的递进</text>
<g font-family="Arial,'PingFang SC'"><g><rect x="80" y="725" width="320" height="125" rx="22" fill="#12345d"/><rect x="220" y="585" width="390" height="125" rx="22" fill="#16436a"/><rect x="360" y="445" width="460" height="125" rx="22" fill="#175775"/><rect x="500" y="305" width="530" height="125" rx="22" fill="#176b7e"/><rect x="640" y="165" width="470" height="125" rx="22" fill="#197b82"/></g>
<g fill="#fff" font-size="31" font-weight="800"><text x="110" y="780">01 单次任务</text><text x="250" y="640">02 多来源整合</text><text x="390" y="500">03 定期自动运行</text><text x="530" y="360">04 生成小工具</text><text x="670" y="220">05 经验持续回流</text></g>
<g fill="#bfe6f7" font-size="23"><text x="110" y="820">低风险、全量审阅</text><text x="250" y="680">先计划，再拉取与核验</text><text x="390" y="540">清单化、可停止、可回滚</text><text x="530" y="400">输入输出明确，人看关键点</text><text x="670" y="260">错误进入清单，成果变模板</text></g></g>
<text x="600" y="910" fill="#f5b84b" font-size="29" font-family="Arial,'PingFang SC'" text-anchor="middle">越往上，越需要清晰边界、可靠验证和明确负责人</text></svg>
